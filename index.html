<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cruzadinha - Arquitetura Computacional</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Cruzadinha: Arquitetura Computacional</h1>
      <div class="banner" aria-hidden="true">
        <!-- Ícones SVG estilizados representando componentes -->
        <svg class="icon icon-chip" viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="chip">
          <rect x="10" y="10" width="44" height="44" rx="6" fill="#0b2545" />
          <rect x="18" y="18" width="28" height="28" rx="3" fill="#0fffbf" opacity="0.12"/>
          <rect x="22" y="22" width="20" height="20" rx="2" fill="#0b2545" />
          <g fill="#1fb97a">
            <rect x="30" y="24" width="4" height="8"/>
            <rect x="24" y="30" width="16" height="4"/>
          </g>
        </svg>
        <svg class="icon icon-ram" viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="memoria">
          <rect x="8" y="18" width="48" height="28" rx="4" fill="#0b2545"/>
          <g fill="#1fb97a">
            <rect x="14" y="24" width="8" height="16"/>
            <rect x="26" y="24" width="8" height="16"/>
            <rect x="38" y="24" width="8" height="16"/>
          </g>
        </svg>
        <svg class="icon icon-board" viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="placa">
          <rect x="6" y="6" width="52" height="52" rx="6" fill="#07203a"/>
          <circle cx="20" cy="20" r="4" fill="#1fb97a"/>
          <circle cx="44" cy="20" r="3" fill="#1fb97a"/>
          <rect x="28" y="34" width="8" height="8" fill="#1fb97a"/>
        </svg>
      </div>
    </header>
    <main>
      <section id="jogo">
        <div id="controles">
          <button id="btn-conferir">Conferir</button>
          <button id="btn-reiniciar">Reiniciar</button>
          <div id="contador">0 de 12 palavras</div>
        </div>
        <div id="area-tabuleiro">
          <div id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro da cruzadinha"></div>
        </div>
        <section id="pistas">
          <div>
            <h2>Horizontais</h2>
            <ol id="lista-horizontais"></ol>
          </div>
          <div>
            <h2>Verticais</h2>
            <ol id="lista-verticais"></ol>
          </div>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
